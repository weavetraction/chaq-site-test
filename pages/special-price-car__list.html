    <script>/* 견적 데이터: 차큐 API(관리자에서 올린 최신 데이터) 우선, API 를 못 읽으면 사이트 파일 */ (function(){var b=(window.CHAQ_API||{}).base; if(b) document.write('<script src="'+String(b).replace(/\/$/,"")+'/api/quotes.js"><\/script>');})();</script>
    <script>window.CHAQ || document.write('<script src="data/quotes.js"><\/script>');</script>
    <script>/* 차량 데이터: 차큐 API(관리자에서 '사이트 반영'한 최신본) 우선, API 를 못 읽으면 사이트 파일 */ (function(){var b=(window.CHAQ_API||{}).base; if(b) document.write('<script src="'+String(b).replace(/\/$/,"")+'/api/pub/vm/core.js"><\/script>');})();</script>
    <script>window.CHAQ_VEHICLE_MASTER || document.write('<script src="data/vehicle-master.js"><\/script>');</script>
    <script src="data/vehicle-master-helper.js"></script>
    <script src="data/trim-groups.js"></script>
    <script>
        (function () {
            var DATA = window.CHAQ || {stock:[],fast:[],estimate:[]};
            var fromMatch = location.search.match(/[?&]from=([a-z]+)/);
            var from = fromMatch ? fromMatch[1] : '';
            var page = from === 'estimate' ? 'estimate' : (from === 'fast' ? 'fast' : 'stock');
            var isEstimate = page === 'estimate';
            var records = DATA[page] || [];

            var titles = { estimate: '견적조회', fast: '빠른인도', stock: '특가차량' };
            document.querySelector('.special_header h1').textContent = titles[page];
            document.title = '차큐 ' + ({ estimate: '견적조회', fast: '빠른인도', stock: '재고특가' })[page];
            var navStock = document.getElementById('navStock'); if (navStock && page !== 'stock') { navStock.classList.remove('is-on'); navStock.removeAttribute('aria-current'); }
            if (isEstimate) document.body.classList.add('view-estimate');

            var PH = "../assets/icons/car-placeholder.svg";  // 차량 이미지 데이터 누락 시 표시할 플레이스홀더 아이콘
            var carImg = window.CHAQ_UTIL.carThumb;   // 카드용 작은 차량 이미지(공통 site-util.js, #53)

            var won = window.CHAQ_UTIL.won;
            function animateNum(el, to, em){ window.CHAQ_UTIL.animateNum(el, to, em); }

            function cond() {
                var groups = document.querySelectorAll('.cond_wrap .filter_group');
                function onText(g){ var b=g.querySelector('.filter_chip.on'); return b?b.textContent:''; }
                var term = (onText(groups[0]).match(/[0-9]+/)||['60'])[0];
                var initTxt = onText(groups[1]);
                var plan = initTxt.indexOf('보증')>-1 ? 'b' : (initTxt.indexOf('선납')>-1 ? 's' : '0');
                var dist = (onText(groups[2]).match(/(\d)만/)||[0,'1'])[1];   // 1만 / 2만 / 3만 km (기본 1만)
                return {term:term, plan:plan, dist:dist};
            }
            function monthly(rec, c) {
                var d = rec.cost && rec.cost[c.dist]; if (!d) return null;
                var t = d[c.term]; if (!t) { for (var k in d){ t=d[k]; break; } }
                if (!t) return null;
                if (t[c.plan]!=null) return t[c.plan] > 0 ? t[c.plan] : null;   // 0원 = 견적 없음 (별도문의)
                for (var p in t) return t[p] > 0 ? t[p] : null;
                return null;
            }

            function monthlyExact(rec, c) {   // 견적조회 전용: 거리·기간·초기유형이 정확히 일치하는 칸만 (빈칸이면 null)
                var t = rec.cost && rec.cost[c.dist] && rec.cost[c.dist][c.term];
                return (t && t[c.plan] > 0) ? t[c.plan] : null;
            }

            var F = {brand:null, model:null, trim:null, all:false};   // 레거시: 이름 문자열 / 차량 데이터 모드: brandId, modelId, 등급 묶음 key · all = '전체 보기'
            // ★ 차량 모델 선택 = 차량 데이터(Vehicle Master) 기준: 견적이 없는 차량도 모두 선택 가능, 숫자 = 이 목록의 견적 차량 수(0대 가능)
            //   등급 = 큰 항목(연료·엔진·인승·구동 묶음, data/trim-groups.js). 세부 트림은 차량 상세에서 선택
            var VM = window.CHAQ_VM, TG = window.CHAQ_TRIM_GROUPS;
            var USE_VM = !!(VM && TG && VM.getBrands && VM.getBrands().length);
            var LABEL = {brand:null, model:null, trim:null};
            var VMK = {};   // 견적 id → { bid, mid, gk }
            if (USE_VM) (function(){
                var byName = {};
                records.forEach(function(r){
                    var d = r.trimId ? VM.describe(r.trimId) : null; if (!d) return;
                    var g = TG.groupOfTrim(r.trimId);
                    VMK[r.id] = { bid: d.brand.id, mid: d.model.id, gk: g ? g.key : null };
                    var nk = r.brand+'|'+r.model; byName[nk] = byName[nk] || {}; byName[nk][d.model.id] = (byName[nk][d.model.id]||0)+1;
                });
                records.forEach(function(r){   // 차량 데이터와 트림 연결이 안 된 견적: 같은 이름의 연결 견적이 가리키는 모델로 (등급 묶음은 없음)
                    if (VMK[r.id]) return; var m = byName[r.brand+'|'+r.model]; if (!m) return;
                    var mid = Object.keys(m).sort(function(a,b){ return m[b]-m[a]; })[0], md = VM.getModel(mid);
                    if (md) VMK[r.id] = { bid: md.brandId, mid: mid, gk: null };
                });
            })();
            function matches(r){
                if (USE_VM) { var k = VMK[r.id]; if (!F.brand) return true; if (!k || k.bid!==F.brand) return false; if (F.model && k.mid!==F.model) return false; if (F.trim && k.gk!==F.trim) return false; return true; }
                return (!F.brand||r.brand===F.brand)&&(!F.model||r.model===F.model)&&(!F.trim||r.trim===F.trim);
            }
            var zeroToggle = document.querySelector('#filterPop .fpop_toggle input');
            if (zeroToggle && USE_VM) zeroToggle.checked = !isEstimate;   // 재고특가·빠른인도: 견적(재고) 있는 차량만(0대 제외 켬, 끄면 별도문의 차량까지) · 견적조회: 전체 차량(견적 없으면 별도문의)
            function hideZero(){ return !!(zeroToggle && zeroToggle.checked); }
            // 견적 없는 차량 카드용: 모델·등급 묶음의 대표 트림
            function groupRep(g){ return g && g.trims && g.trims[0] ? g.trims[0].id : null; }
            function modelRep(mid){ var gs = TG.groups(mid); return gs.length ? { g: gs[0], tid: groupRep(gs[0]) } : null; }
            function vmCount(pred){ var n=0; records.forEach(function(r){ var k=VMK[r.id]; if(k && pred(k)) n++; }); return n; }
            function vmImg(tid){ try { return (tid && VM.resolveImageUrl(tid,[PH],true)) || PH; } catch(e){ return PH; } }
            var escT = window.CHAQ_UTIL.esc;
            function estName(r){ var d=(window.CHAQ_VM && r && r.trimId && window.CHAQ_VM.describe) ? window.CHAQ_VM.describe(r.trimId) : null, o=String((d && d.model && d.model.nameKo) || (r && r.model) || carName(r) || ''), x=o.replace(/(^|\s)(?:플러그인\s+)?하이브리드(?=\s|$)/g,' ').replace(/(^|\s)(?:일렉트릭|일렉트리파이드|EV)(?=\s|$)/g,' ').replace(/\s{2,}/g,' ').trim(); return escT(x||o); }   // 견적조회 등급 선택 카드 차명 = 상세 요약 카드와 같은 규칙(모델명만 · 연료 수식어 제외)
            function carNameH(r){ return (window.CHAQ_VM && window.CHAQ_VM.carNameHtml) ? window.CHAQ_VM.carNameHtml(r) : escT(carName(r)); }   // 카드 차명: 길면 '브랜드 모델 / 세부 모델' 두 줄
            function carName(r){ return (window.CHAQ_VM && window.CHAQ_VM.carName) ? window.CHAQ_VM.carName(r) : (r.brand+' '+r.model); }   // 카탈로그 차명 (차량 데이터 연결 시)
            function trimTag(r){   // 재고특가·빠른인도 카드: 옵션 태그 옆 세부 등급 태그 (차량 데이터 트림명, 묶음에 나온 구동·인승 표기 제외)
                var t = USE_VM && r.trimId ? VM.getTrim(r.trimId) : null; if (!t) return '';
                TG.groupOfTrim(r.trimId); return '<span class="opt-tag trim-tag">'+escT(TG.shortName(t))+'</span>';
            }
            function lineupTag(r){   // 견적조회 카드: 같은 등급 이름(예: 트렌디)이 여러 라인업에 있을 때 구분 — 차량 데이터의 라인업(예: 가솔린 1.0 (밴))
                var t = USE_VM && r.trimId ? VM.getTrim(r.trimId) : null, ln = t && t.fileTrimName ? String(t.fileTrimName).split(' / ')[0] : '';
                return ln ? '<span class="opt-tag lineup-tag">'+escT(ln)+'</span>' : '';
            }
            function inquiryCard(tid, title, sub, c){   // 견적 데이터가 없는 차량: 비용칸 '별도문의'
                return '<a class="stock-card is-inquiry" href="car-detail.html?trimId='+encodeURIComponent(tid)+'&from='+page+'&term='+c.term+'&plan='+c.plan+'&dist='+c.dist+'">'+
                    '<img src="'+escT(vmImg(tid))+'" alt="'+escT(title)+'" loading="lazy" onerror="this.onerror=null;this.src=\''+PH+'\'">'+
                    '<span class="stock-copy"><small class="cn">'+carNameH({trimId: tid})+'</small>'+
                    '<strong class="is-inquiry">월 별도문의</strong>'+
                    '<b><span class="opt-tag">'+escT(sub)+'</span></b></span>'+
                    '<span class="stock-cta">상세보기</span></a>';
            }

            var sortSel = document.getElementById('selSort');
            function sortList(arr, c) {
                var v = sortSel ? sortSel.value : 'default';
                var byCar = v.indexOf('carPrice')===0;
                var desc = v.endsWith('Desc');
                // 차량가 정렬 = 차량 총가격(기본 + 옵션 + 할인, 상세 가격 영역과 같은 계산)
                var tot = {}, U = window.CHAQ_UTIL, carP = function(r){ if(!(r.id in tot)) tot[r.id] = U && U.carTotal ? U.carTotal(r) : (r.base||0); return tot[r.id]; };
                arr.sort(function(a,b){
                    if (!byCar) { var am = mOf(a,c), bm = mOf(b,c); if ((am==null) !== (bm==null)) return am==null ? 1 : -1; }   // 이 조건 월 납입금이 없는 차량(별도문의)은 항상 뒤로
                    var av = byCar ? carP(a) : (mOf(a,c)||0);
                    var bv = byCar ? carP(b) : (mOf(b,c)||0);
                    return desc ? bv-av : av-bv;
                });
                return arr;
            }

            var listEl = document.getElementById('stockList');
            var estEl = document.getElementById('estCard');
            var noEl = document.getElementById('noResult');
            var countEl = document.querySelector('.result_header p strong');

            // 목록 월 납입금: 견적조회는 고른 조건 그대로의 칸만(다른 조건 값으로 대신하지 않음), 재고특가·빠른인도는 기존 규칙
            var isEF = (window.CHAQ_UTIL||{}).isEstFin || function(){ return false; };
            function mOf(r,c){ return isEstimate ? monthlyExact(r,c) : monthly(r,c); }
            function estPerTrim(arr, c){   // 견적조회 목록: 같은 트림의 금융사별 견적 중 최저가 1개 (실견적 우선, 없으면 딜리버 기준가)
                var by = {}, order = [];
                arr.forEach(function(r){
                    var k = r.trimId || r.id, m = monthlyExact(r,c), est = isEF(r), cur = by[k];
                    if (!cur) { order.push(k); by[k] = { r: r, m: m, est: est }; return; }
                    var better = (m!=null && cur.m==null) || (m!=null && cur.est && !est) || (m!=null && cur.est === est && m < cur.m);
                    if (better) by[k] = { r: r, m: m, est: est };
                });
                return order.map(function(k){ return by[k].r; });
            }

                }
            });

            function placeholderText(t){ return {brand:'브랜드 선택',model:'모델 선택',trim:'등급 선택'}[t]; }
            function syncSelects(){
                ['brand','model','trim'].forEach(function(t){
                    var sel=document.querySelector('.filter_select[data-filter="'+t+'"]');
                    if(!sel) return;
                    var txt=sel.querySelector('.fs_text');
                    var shown = USE_VM ? (LABEL[t]||F[t]) : F[t];
                    if(F[t]){ if(txt)txt.textContent=shown; sel.classList.add('is-selected'); }
                    else { if(txt)txt.textContent=placeholderText(t); sel.classList.remove('is-selected'); }
                });
            }
            var condWrap=document.querySelector('.cond_wrap');
            function updateCondLock(){ if(condWrap) condWrap.classList.remove('is-locked'); }   // 계약 조건은 차량 선택 전에도 바로 바꿀 수 있음 (사용성 점검 261014)
            function clearFrom(type){
                F[type]=null; LABEL[type]=null; F.all=false;
                if(type==='brand'){ F.model=null; F.trim=null; }
                if(type==='model'){ F.trim=null; }
                syncSelects(); updateFilterLock(); updateCondLock(); render();
            }
            document.querySelectorAll('.filter_select .fs_clear').forEach(function(x){
                x.addEventListener('click', function(e){ e.stopPropagation(); var sel=x.closest('.filter_select'); if(sel) clearFrom(sel.getAttribute('data-filter')); });
            });

            // 보증금/선납금 태그 ⓘ 설명 말풍선
            var TIPTEXT={
                deposit:'차량가의 일부를 보증금으로 예치하고 계약 만기에 그대로 돌려받는 방식입니다. 보증금이 클수록 월 납입금이 낮아집니다.',
                prepay:'월 납입금의 일부를 계약 시 미리 납부하는 방식입니다. 선납금은 돌려받지 않지만 월 납입금이 더 크게 낮아집니다.'
            };
            var condTip=document.createElement('div'); condTip.className='cond_tip'; document.body.appendChild(condTip); condTip._for=null;
            function hideTip(){ condTip.style.display='none'; condTip._for=null; }
            function showTip(ic){
                condTip.textContent=TIPTEXT[ic.getAttribute('data-info')]||'';
                condTip.style.left='-9999px'; condTip.style.top='0'; condTip.style.display='block';
                var r=ic.getBoundingClientRect(), tw=condTip.offsetWidth;
                var cx=r.left+r.width/2, left=cx-tw/2;
                left=Math.max(10, Math.min(left, window.innerWidth-tw-10));
                condTip.style.left=left+'px'; condTip.style.top=(r.bottom+9)+'px';
                condTip.style.setProperty('--tail',(cx-left)+'px'); condTip._for=ic;
            }
            document.querySelectorAll('.cond_wrap .tag_info').forEach(function(ic){
                ic.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); if(condTip.style.display==='block'&&condTip._for===ic) hideTip(); else showTip(ic); });
            });
            document.addEventListener('click', function(e){ if(!(e.target.closest&&e.target.closest('.tag_info'))) hideTip(); });
            window.addEventListener('scroll', hideTip, true);
            window.addEventListener('resize', hideTip);

            restoreState(); syncSelects(); updateFilterLock(); updateCondLock(); render();
        })();
    </script>
