    <script>/* 폰 화면 자동 크기 (대표 261015): 폭 430px보다 좁은 폰(세로)은 430px 기준 화면을 폰 폭에 맞춰 통째로 줄여 보여줌 — 어느 폰에서나 같은 배치. 가로·태블릿·PC는 그대로 */(function(){var W=430,m=document.querySelector('meta[name="viewport"]');if(!m)return;try{document.documentElement.style.webkitTextSizeAdjust='100%';document.documentElement.style.textSizeAdjust='100%';}catch(e){}function set(){var s=Math.min(screen.width||0,screen.height||0),p=!window.matchMedia||matchMedia('(orientation: portrait)').matches,c=(s&&s<W&&p)?'width='+W:'width=device-width, initial-scale=1.0';if(m.getAttribute('content')!==c)m.setAttribute('content',c);}set();window.addEventListener('orientationchange',function(){setTimeout(set,60);});if(window.matchMedia){var q=matchMedia('(orientation: portrait)');if(q.addEventListener)q.addEventListener('change',set);else if(q.addListener)q.addListener(set);}})();</script>

    <script>/* 관리자에서 등록한 최신 데이터(API) 우선, 못 읽으면 사이트 파일 */ (function(){var b=(window.CHAQ_API||{}).base; if(b) document.write('<script src="'+String(b).replace(/\/$/,"")+'/api/pub/content.js"><\/script>');})();</script>
    <script>window.CHAQ_CONTENT || document.write('<script src="data/content.js"><\/script>');</script>
    <script>
        (function(){
            var list = (window.CHAQ_CONTENT && window.CHAQ_CONTENT.articles) || [];
            var m = location.search.match(/[?&]id=([^&]+)/);
            var id = m ? decodeURIComponent(m[1]) : '';
            var a = list.filter(function(x){ return x.id===id; })[0] || list[0];
            var view = document.getElementById('articleView');
            if(!a){ view.innerHTML='<p class="detail_empty">아티클을 찾을 수 없습니다.</p>'; return; }
            var esc = window.CHAQ_UTIL.esc;
            document.title = '차큐 아티클 · ' + a.title;
            var sections = a.html ? '<section class="dv_sec dv_rich">'+a.html+'</section>' : (a.body||[]).map(function(b){
                return '<section class="dv_sec"><h3>'+esc(b.h)+'</h3><p>'+esc(b.p)+'</p></section>';
            }).join('');
            view.innerHTML =
                '<div class="dv_hero"><img src="'+a.img+'" alt=""></div>'+
                '<div class="dv_head">'+
                    '<span class="dv_cat">'+esc(a.cat)+'</span>'+
                    '<h2 class="dv_title">'+esc(a.title)+'</h2>'+
                    '<span class="dv_date">'+esc(a.date)+'</span>'+
                '</div>'+
                '<p class="dv_lead">'+esc(a.lead)+'</p>'+
                sections+
                '<a class="dv_cta" href="special-price-car__list.html?from=estimate">내 조건으로 견적 비교하기</a>';
        })();
    </script>
