<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차큐 마이페이지</title>
    <link rel="stylesheet" href="../stylesheets/detail-overrides.css">
    <script src="data/api-config.js"></script>
    <script src="data/site-util.js"></script>
    <script src="data/analytics.js"></script>
</head>
<body class="local-sub sub-white mypage">
    <div class="sub_shell">
        <header class="sub_header">
            <button type="button" class="sub_back" aria-label="뒤로 가기" onclick="location.href='../index.html'">뒤로</button>
            <h1>마이페이지</h1>
        </header>

        <main>
            <!-- 내 견적함 안내 (로그인 없이 이 기기에 저장) -->
            <section class="mp_profile" id="mpProfile"><span class="mp_pinfo"><strong>내 견적함</strong><small class="mp_pnote">로그인 없이 이 기기(브라우저)에 저장돼요</small></span></section>

            <!-- 상담 신청 내역 (이 기기에서 신청한 상담) -->
            <section class="mp_sec">
                <div class="mp_sec_head"><h2>상담 신청 내역</h2><span class="mp_count" id="mpInqCount"></span></div>
                <div class="mp_inq" id="mpInq"></div>
            </section>

            <!-- 내가 저장한 견적 -->
            <section class="mp_sec">
                <div class="mp_sec_head"><h2>내가 저장한 견적</h2><span class="mp_count" id="mpSavedCount"></span></div>
                <p class="mp_note">저장한 시점의 금액이에요. '확인하기'를 눌러 현재 기준 견적을 다시 확인해주세요.</p>
                <div class="mp_saved" id="mpSaved"></div>
            </section>

            <!-- 최근 본 견적 -->
            <section class="mp_sec">
                <div class="mp_sec_head"><h2>최근 본 견적</h2></div>
                <div class="mp_recent_scroll" id="mpRecent"></div>
            </section>

            <!-- 차큐에 문의하기 (메인페이지 문의 카드) -->
            <section class="mp_sec">
                <div class="mp_sec_head"><h2>차큐에 문의하기</h2></div>
                <div class="guide-grid">
                    <button type="button" data-pending-link data-action="inquiry"><strong>이미 이용 중이신가요?</strong><span>사고·보험 처리,<br>반납/위약금 등</span><b>무엇이든 물어보세요 ›</b></button>
                    <button type="button" data-pending-link data-action="inquiry"><strong>계약 고민 중이신가요?</strong><span>최저가 비교, 숨은 조건,<br>즉시 출고 차량 조회 등</span><b>출고 고민 상담 ›</b></button>
                </div>
            </section>
        </main>

        <p class="mp_withdraw" id="mpWithdraw" hidden><button type="button" id="mpWithdrawBtn">회원 탈퇴</button></p>

        <footer class="chaq-biz-footer">
            <img class="cf-logo" src="../assets/icons/logo.svg" alt="chaQ">
            <p class="cf-info">주식회사 위브트랙션 · 차큐<br>대표자 강병진 · 사업자등록번호 471-87-04214<br>서울특별시 강남구 역삼로 512, 5층 6<br>대표번호 1533-5663 · Contact@chaq.kr</p>
            <p class="cf-links"><a href="agreement.html">이용약관</a><span>·</span><a href="agreement.html">개인정보처리방침</a></p>
        </footer>

        <footer class="sub_footer">
            <button type="button" onclick="location.href='../index.html'"><i class="gnb-icon-pair"><img class="gnb-icon-default" src="../assets/icons/home.svg" alt=""><img class="gnb-icon-color" src="../assets/icons/home-color.svg" alt=""></i><span>홈</span></button>
            <button type="button" onclick="location.href='special-price-car__list.html'"><i class="gnb-icon-pair"><img class="gnb-icon-default" src="../assets/icons/special-gray.svg" alt=""><img class="gnb-icon-color" src="../assets/icons/special-color.svg" alt=""></i><span>재고특가</span></button>
            <button type="button" onclick="location.href='event__list__ing.html'"><b>최대 100만원</b><i class="gnb-icon-pair"><img class="gnb-icon-default" src="../assets/icons/event.svg" alt=""><img class="gnb-icon-color" src="../assets/icons/event-color.svg" alt=""></i><span>이벤트</span></button>
            <button class="on" type="button"><i class="gnb-icon-pair"><img class="gnb-icon-default" src="../assets/icons/mypage.svg" alt=""><img class="gnb-icon-color" src="../assets/icons/mypage-color.svg" alt=""></i><span>마이페이지</span></button>
            <button type="button" onclick="location.href='../index.html#menu'"><i class="nav_more">•••</i><span>전체메뉴</span></button>
        </footer>
    </div>

    <script src="data/api-config.js"></script>
    <script>/* 견적 데이터: 차큐 API(관리자에서 올린 최신 데이터) 우선, API 를 못 읽으면 사이트 파일 */ (function(){var b=(window.CHAQ_API||{}).base; if(b) document.write('<script src="'+String(b).replace(/\/$/,"")+'/api/quotes.js"><\/script>');})();</script>
    <script>window.CHAQ || document.write('<script src="data/quotes.js"><\/script>');</script>
    <script>/* 차량 데이터: 차큐 API(관리자에서 '사이트 반영'한 최신본) 우선, API 를 못 읽으면 사이트 파일 */ (function(){var b=(window.CHAQ_API||{}).base; if(b) document.write('<script src="'+String(b).replace(/\/$/,"")+'/api/pub/vm/core.js"><\/script>');})();</script>
    <script>window.CHAQ_VEHICLE_MASTER || document.write('<script src="data/vehicle-master.js"><\/script>');</script>
    <script src="data/vehicle-master-helper.js"></script>
    <script>
        (function(){
            var C = window.CHAQ || {stock:[],fast:[],estimate:[]};
            var PH = "../assets/icons/car-placeholder.svg";
            var carImg = window.CHAQ_UTIL.carImg;   // 차량 이미지(공통 site-util.js)
            var ALL = (C.stock||[]).concat(C.fast||[], C.estimate||[]);
            var esc = window.CHAQ_UTIL.esc;
            function car(id){ for(var i=0;i<ALL.length;i++){ if(ALL[i].id===id) return ALL[i]; } return null; }
            var won = window.CHAQ_UTIL.won;
            function monthly(r,c){ try{ var t=r.cost[c.dist][c.term]; return (t[c.plan]!=null)?t[c.plan]:t['0']; }catch(e){ return null; } }
            function planLabel(p){ return p==='b'?'보증금':(p==='s'?'선납금':'초기비용 0원'); }
            function condText(c){ return c.term+'개월 · '+planLabel(c.plan)+' · '+c.dist+'만km'; }
            function detailHref(id,c){ return 'car-detail.html?id='+id+'&term='+c.term+'&plan='+c.plan+'&dist='+c.dist; }

            var U = window.CHAQ_UTIL, ST = U.store;
            function vmName(x){ var VM=window.CHAQ_VM; if(x.r) return (VM&&VM.carNameHtml)?VM.carNameHtml(x.r):esc(x.r.brand+' '+x.r.model); if(x.trimId&&VM&&VM.getTrim&&VM.getTrim(x.trimId)) return VM.carNameHtml({trimId:x.trimId}); return esc(x.carName||'차량'); }
            function hrefOf(x,c){ return x.r ? detailHref(x.r.id,c) : (x.trimId ? 'car-detail.html?trimId='+encodeURIComponent(x.trimId)+'&term='+c.term+'&plan='+c.plan+'&dist='+c.dist : null); }
            function imgOf(x){ return x.r ? carImg(x.r) : (x.trimId ? carImg({trimId:x.trimId}) : PH); }
            function fmtDate(iso){ var d=new Date(iso); return isNaN(d)?'':(d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')); }

            // 상담 신청 내역 (이 기기에서 접수한 상담)
            var inq = (window.CHAQ_INQUIRY && window.CHAQ_INQUIRY.history) ? window.CHAQ_INQUIRY.history() : (function(){ try { return JSON.parse(localStorage.getItem('chaq_inquiries_v1')||'[]'); } catch(e){ return []; } })();
            document.getElementById('mpInqCount').textContent = inq.length ? inq.length+'건' : '';
            document.getElementById('mpInq').innerHTML = inq.map(function(q){
                return '<div class="mp_inq_row"><span class="mp_inq_t"><strong>'+esc(q.car||q.topic||'일반 상담')+'</strong>'+(q.cond?'<small>'+esc(q.cond)+'</small>':'')+'</span><span class="mp_inq_s"><em>접수 완료</em><small>'+fmtDate(q.at)+(q.id?' · #'+q.id:'')+'</small></span></div>';
            }).join('') || '<p class="mp_empty">신청한 상담이 없습니다. 아래 \'차큐에 문의하기\'나 차량 상세의 \'이 조건 그대로 문의하기\'로 신청할 수 있어요.</p>';

            // 내가 저장한 견적 (차량 상세 '견적 저장하기')
            var saved = ST.saved().map(function(q){ return { q:q, r: q.id ? car(q.id) : null, trimId:q.trimId, carName:q.carName }; });
            document.getElementById('mpSavedCount').textContent = saved.length+'건';
            document.getElementById('mpSaved').innerHTML = saved.map(function(x){
                var q=x.q, c={term:q.term||'60',plan:q.plan||'0',dist:q.dist||'2'}, href=hrefOf(x,c);
                var m = q.price!=null ? q.price : (x.r?monthly(x.r,c):null);   // 저장 당시 월 납입금(스냅샷)
                return '<a class="mp_qcard"'+(href?' href="'+href+'"':'')+'>'+
                    '<img src="'+imgOf(x)+'" alt="">'+
                    '<span class="mp_qinfo"><small class="cn">'+vmName(x)+'</small>'+
                    '<strong>'+(m!=null?'월 '+won(m)+'원':'월 별도문의')+'</strong>'+
                    '<span class="mp_qcond">'+esc(condText(c))+'</span></span>'+
                    '<span class="mp_qcta">확인하기</span></a>';
            }).join('') || '<p class="mp_empty">저장한 견적이 없습니다. 차량 상세에서 \'견적 저장하기\'를 눌러 보세요.</p>';

            // 최근 본 견적 (가로 스크롤 · 이 기기에서 본 차량 상세)
            var dc={term:'60',plan:'0',dist:'2'};
            var recent = ST.recent().map(function(q){ return { r: q.id ? car(q.id) : null, trimId:q.trimId, carName:q.carName }; }).filter(function(x){ return x.r || x.trimId; });
            document.getElementById('mpRecent').innerHTML = recent.map(function(x){
                var m=x.r?monthly(x.r,dc):null, href=hrefOf(x,dc);
                return '<a class="mp_recent"'+(href?' href="'+href+'"':'')+'>'+
                    '<img src="'+imgOf(x)+'" alt="">'+
                    '<small class="cn">'+vmName(x)+'</small>'+
                    '<strong>'+(m!=null?'월 '+won(m)+'원':'월 별도문의')+'</strong></a>';
            }).join('') || '<p class="mp_empty">최근 본 견적이 없습니다.</p>';
        })();
    </script>
    <script src="data/auth.js"></script>   <!-- 회원: 카카오·휴대폰 가입 시트 · 비회원 조건 변경 제한 -->
    <script src="data/inquiry.js"></script>   <!-- 상담 문의: 회원 → 카카오톡 견적서·상담 / 로그인 수단 없으면 채널톡·상담 신청 양식 -->
    <script>
        /* 회원: 로그인 상태 · 서버의 상담 신청 내역(견적서 보기) · 로그아웃 · 마케팅 수신 · 탈퇴 */
        (function(){
            var AU = window.CHAQ_AUTH, U = window.CHAQ_UTIL; if (!AU) return;
            var esc = U.esc, won = U.won, prof = document.getElementById('mpProfile');
            var ST = { NEW:'접수 완료', IN_PROGRESS:'상담 중', CONTRACTED:'계약 완료', CLOSED:'상담 종료' };
            var PLAN = { '0':'초기비용 0원', b:'보증금 30%', s:'선납금 30%' };
            function d8(iso){ var d=new Date(iso); return isNaN(d)?'':(d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')); }
            function render(){
                var st = AU.state() || {}, m = st.member, A = st.auth || {};
                if (m) {
                    prof.innerHTML = '<span class="mp_pinfo"><strong>'+esc(m.name || '차큐 회원')+'님</strong><small class="mp_pnote">'+esc(m.phone || '휴대폰 번호 확인 전')+(m.kakao?' · 카카오 로그인':'')+'</small></span>'+
                        '<span class="mp_pact"><button type="button" class="mp_pbtn" data-act="logout">로그아웃</button></span>'+
                        '<label class="mp_mkt"><input type="checkbox" data-act="mkt"'+(m.marketing?' checked':'')+'> 혜택·이벤트 소식 받기 (카카오톡·문자)</label>';
                    AU.api('/api/me/inquiries').then(function(j){
                        var rows = (j.rows||[]).filter(function(r){ return r.status !== 'SPAM'; });
                        document.getElementById('mpInqCount').textContent = rows.length ? rows.length+'건' : '';
                        document.getElementById('mpInq').innerHTML = rows.map(function(r){
                            var c = r.conditions||{}, cond = [c.product, c.term?c.term+'개월':'', PLAN[c.plan]||'', c.dist?'연 '+c.dist+'만 km':'', r.monthly?'월 '+won(r.monthly)+'원':''].filter(Boolean).join(' · ');
                            return '<div class="mp_inq_row"><span class="mp_inq_t"><strong>'+esc(((r.car_name||'')+' '+(r.trim_name||'')).trim() || '일반 상담')+'</strong>'+(cond?'<small>'+esc(cond)+'</small>':'')+(r.report_token?'<a class="mp_inq_rep" href="quote-report.html?t='+encodeURIComponent(r.report_token)+'">견적서 보기 ›</a>':'')+'</span><span class="mp_inq_s"><em>'+(ST[r.status]||'접수 완료')+'</em><small>'+d8(r.created_at)+' · #'+r.id+'</small></span></div>';
                        }).join('') || '<p class="mp_empty">신청한 상담이 없습니다. 차량 상세의 \'이 조건 그대로 문의하기\'로 견적을 카카오톡으로 받아보세요.</p>';
                    }).catch(function(){});
                } else if (A.kakao || A.sms) {
                    prof.innerHTML = '<span class="mp_pinfo"><strong>내 견적함</strong><small class="mp_pnote">가입하면 상담 내역과 견적서를 어디서든 볼 수 있어요</small></span><span class="mp_pact"><button type="button" class="mp_pbtn on" data-act="login">로그인 · 가입</button></span>';
                }
                var wd = document.getElementById('mpWithdraw'); if (wd) wd.hidden = !m;
            }
            prof.addEventListener('click', function(e){
                var b = e.target.closest('[data-act]'); if (!b) return;
                var act = b.getAttribute('data-act');
                if (act === 'login') AU.open('mypage').then(function(){ render(); }).catch(function(){});
                if (act === 'logout') AU.logout().then(function(){ U.toast('로그아웃했어요'); location.reload(); });
            });
            prof.addEventListener('change', function(e){
                if (e.target.getAttribute('data-act') !== 'mkt') return;
                AU.api('/api/me/marketing', { method:'POST', json:{ on: e.target.checked } }).then(function(){ U.toast(e.target.checked ? '혜택 소식을 보내드릴게요' : '혜택 소식 받기를 껐어요'); }).catch(function(){ e.target.checked = !e.target.checked; U.toast('잠시 후 다시 시도해 주세요'); });
            });
            var wdb = document.getElementById('mpWithdrawBtn');
            if (wdb) wdb.addEventListener('click', function(){
                if (!window.confirm('회원 탈퇴할까요? 가입 정보가 지워지고 다시 되돌릴 수 없어요. (진행 중인 상담 기록은 상담 종료 후 1년간 보관 후 파기돼요)')) return;
                AU.api('/api/me/withdraw', { method:'POST' }).then(function(){ U.toast('탈퇴가 완료됐어요'); setTimeout(function(){ location.reload(); }, 800); }).catch(function(e){ U.toast(e.message); });
            });
            AU.me(true).then(render);
            document.addEventListener('chaq:login', render);
        })();
    </script>
</body>
</html>
