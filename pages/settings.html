<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인정보 설정</title>
    <link rel="stylesheet" href="../stylesheets/detail-overrides.css">
    <script src="data/api-config.js"></script>
    <script src="data/site-util.js"></script>
    <script src="data/analytics.js"></script>
    <style>.local-sub.settings main{visibility:hidden}.local-sub.settings.is-ready main{visibility:visible}.set_note{margin:2px 0 0;color:#8a8f96;font-size:12.5px;line-height:1.6;word-break:keep-all}</style>
</head>
<body class="local-sub sub-white settings">
    <div class="sub_shell">
        <header class="sub_header">
            <button type="button" class="sub_back" aria-label="뒤로 가기" onclick="location.href='mypage.html'">뒤로</button>
            <h1>개인정보 설정</h1>
        </header>

        <main>
            <!-- 계정 정보 -->
            <section class="set_group">
                <h2 class="set_group_title">계정 정보</h2>
                <div class="set_row">
                    <span class="set_label">이름</span>
                    <span class="set_value" id="setName">-</span>
                </div>
                <div class="set_row">
                    <span class="set_label">휴대폰 번호</span>
                    <span class="set_value" id="setPhone">-</span>
                </div>
            </section>

            <!-- 연결된 소셜 계정 (카카오만 지원) -->
            <section class="set_group">
                <h2 class="set_group_title">연결된 소셜 계정</h2>
                <div class="set_row">
                    <span class="set_social">
                        <span class="set_social_ico kakao" aria-hidden="true"></span>
                        <span class="set_social_txt"><strong>카카오</strong><small id="kakaoState">-</small></span>
                    </span>
                </div>
            </section>

            <!-- 지원금 입금 계좌 관리: 서버 저장·약관(금융정보 수집) 준비 후 다시 연결 -->
            <!-- 알림 설정 -->
            <section class="set_group">
                <h2 class="set_group_title">알림 설정</h2>
                <div class="set_row">
                    <span class="set_switch_txt"><strong>마케팅 정보 수신 동의</strong><small>혜택·이벤트·신차 소식을<br>카카오톡·문자로 보내드려요</small></span>
                    <label class="set_toggle">
                        <input type="checkbox" id="mktToggle" aria-label="마케팅 정보 수신 동의">
                        <i></i>
                    </label>
                </div>
            </section>

            <!-- 로그아웃 / 회원 탈퇴 -->
            <section class="set_group is-plain">
                <button type="button" class="set_logout" id="logoutBtn" data-action="logout">로그아웃</button>
                <button type="button" class="set_withdraw" id="withdrawBtn" data-action="withdraw">탈퇴하기</button>
            </section>
        </main>

        <footer class="chaq-biz-footer">
            <img class="cf-logo" src="../assets/icons/logo.svg" alt="chaQ">
            <p class="cf-info">주식회사 위브트랙션 · 차큐<br>대표자 강병진 · 사업자등록번호 471-87-04214<br>서울특별시 강남구 역삼로 512, 5층 6<br>대표번호 1533-5663 · Contact@chaq.kr</p>
            <p class="cf-links"><a href="agreement.html">이용약관</a><span>·</span><a href="privacy.html">개인정보처리방침</a></p>
        </footer>
    </div>

    <script src="data/auth.js"></script>   <!-- 회원 정보·로그아웃·탈퇴 -->
    <script>
        /* 개인정보 설정 (회원 전용): 이름·휴대폰(가린 번호)·카카오 연결 · 마케팅 수신 · 로그아웃 · 탈퇴 */
        (function () {
            var $ = function (id) { return document.getElementById(id); }, AU = window.CHAQ_AUTH, U = window.CHAQ_UTIL;
            if (!AU) return location.replace('mypage.html');
            AU.me(true).then(function (m) {
                var A = (AU.state() || {}).auth || {};
                if (!m) return location.replace((A.kakao || A.sms) ? 'login.html?return=settings.html' : 'mypage.html');   // 비회원 → 로그인 (로그인 수단 준비 전이면 마이페이지)
                $('setName').textContent = m.name || '-';
                $('setPhone').textContent = m.phone ? m.phone + (m.phoneVerified === false ? ' (미인증)' : '') : '-';
                $('kakaoState').textContent = m.kakao ? '연결됨' : '연결 안 됨';
                $('mktToggle').checked = !!m.marketing;
                document.body.classList.add('is-ready');
            });
            $('mktToggle').addEventListener('change', function () {
                var el = this;
                AU.api('/api/me/marketing', { method: 'POST', json: { on: el.checked } })
                    .then(function () { U.toast(el.checked ? '혜택 소식을 보내드릴게요' : '혜택 소식 받기를 껐어요'); })
                    .catch(function () { el.checked = !el.checked; U.toast('잠시 후 다시 시도해 주세요'); });
            });
            $('logoutBtn').addEventListener('click', function () {
                if (!confirm('로그아웃 하시겠어요?')) return;
                AU.logout().then(function () { location.replace('../index.html'); });
            });
            $('withdrawBtn').addEventListener('click', function () {
                if (!confirm('정말 탈퇴하시겠어요?\n가입 정보가 지워지고 되돌릴 수 없어요.\n(진행 중인 상담 기록은 상담 종료 후 1년간 보관 후 파기돼요)')) return;
                AU.api('/api/me/withdraw', { method: 'POST' }).then(function () { U.toast('탈퇴가 완료됐어요'); setTimeout(function () { location.replace('../index.html'); }, 800); }).catch(function (e) { U.toast(e.message); });
            });
        })();
    </script>
</body>
</html>
